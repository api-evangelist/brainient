name: Brainient
description: >-
  Brainient was a London-based advertising technology company founded in 2009 by
  Emi Gal that specialized in interactive video advertising and Dynamic Creative
  Optimization (DCO). Its platform made online video ads more personalized and
  interactive by matching creative to real-time context such as socio-demographics,
  geolocation, device, time of day, and weather. Brainient was acquired by Teads in
  September 2016 and folded into the Teads Studio division; the standalone Brainient
  brand and its brainient.com domain are now defunct. This profile was surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network as a lead.
  No public API surface, developer documentation, or machine-readable specification
  was located for Brainient during enrichment.
